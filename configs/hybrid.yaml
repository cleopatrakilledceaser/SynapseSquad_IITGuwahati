# Part 5.1: hybrid twin (mechanistic twin features + ML). Decisions: docs/DECISIONS.md D-038 on.
# Units: glucose mg/dL, time min. Folds = Part 2/3/4 CV repeat 0 (identical for every model).
seed: 42
horizons_min: [30, 60, 120]
cv_repeat: 0
k_grid: [0, 0.5, 1, 2, 3, 5, 7]     # twin-feature levels (days of the patient's own data)
comparison_k: [0, 1, 3]             # hybrid comparison table (same test windows as Part 4)
test_from_day: 3                    # hybrid table: anchors with day >= 3 (Part 4 windows)

twin:
  # original Part 4 spec (D-037) with alpha_E = 0 (activity effect <= 0.12 mg/dL, D-036): the
  # twin equals Part 4 twin_pop_actoff_k<k>. The activity input A(t) and the E state are still
  # computed and offered to the ML layer as features (tw_act, tw_act_mean_1h, tw_E).
  alpha_e: 0.0
  part4_variant: actoff
  innov_window_min: 60              # causal rolling mean of filter innovations
  act_window_min: 60                # causal rolling mean of the activity input
  traj_k: 3                         # keep the 0..120-min open-loop rollout for Hybrid C at this k
  sel_min_day: 3                    # (q, r) selection windows for new k: day >= max(3, k)

lgbm:
  # A0 = Part 3 best LightGBM content: CGM + time of day + meals + glycemic static, delta target
  groups:
    cgmacros: {dynamic: [cgm, tod, meals], static: [static_glycemic]}
    shanghai_t2dm: {dynamic: [cgm, tod], static: [static_hba1c]}
  twin_features: [tw_d30, tw_d60, tw_d120, tw_sd30, tw_sd60, tw_sd120, tw_Q1, tw_Q2, tw_U, tw_X,
                  tw_Ra, tw_gres, tw_innov, tw_innov_z, tw_innov_mean_1h, tw_E, tw_act,
                  tw_act_mean_1h]
  activity_features: [tw_E, tw_act, tw_act_mean_1h]

pinn:                               # Hybrid C: GRU + FiLM with an ODE-consistency loss
  k: 3
  seeds: [0, 1, 2, 3, 4]
  lambda_grid: [0.0, 0.1, 1.0, 10.0] # chosen per fold on inner-validation patients (seed 0)
  step_min: 5                       # trajectory step (CGMacros grid)
  horizon_max_min: 120
  phys_scale: 1.0                   # residual unit (mg/dL/min)
  channels: [cgm, wearable, meals, tod]
  parallel: 4
  threads: 2

onset_fix:                          # Part 3 GRU + FiLM retrained with an onset-weighted loss
  configs: [B_cgm, E_full]
  weight_grid: [3.0, 10.0]          # chosen once on holdout-train patients (inner split, seed 0)
  threshold_mgdl: 140               # window starts below and ends above (y at t + h)

sensitivity_exclude: [cgmacros_007]
