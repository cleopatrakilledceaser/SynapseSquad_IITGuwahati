# Baselines (Part 2). All tuning is nested: inside each outer fold, on that fold's training
# patients only (inner patient-level split). Test patients are never used for any choice.
seed: 42
cohorts: [cgmacros, shanghai_t2dm]

inner_split:                      # patient-level split of the outer-train patients
  train: 0.8
  calibration: 0.2                # used as the inner validation set
  test: 0.0

linear_trend:
  window_min_grid: [15, 30, 60]   # slope window (must exist as cgm_slope_<w> feature)
  damping_grid: [0.25, 0.5, 1.0]  # forecast = now + damping * h * slope (1.0 = plain extrapolation)

holt:                             # damped-trend exponential smoothing (statsmodels-validated)
  history_min: 120
  alpha_grid: [0.2, 0.4, 0.6, 0.8, 0.95]
  beta_grid: [0.05, 0.1, 0.2, 0.4]
  phi_grid: [0.5, 0.65, 0.8, 0.9, 0.98]   # widened: first run picked the edges (0.8 alpha/phi)

ar:                               # pooled AR fitted with statsmodels OLS
  order_min_grid: [30, 60, 120, 180]   # p = order / step; 180 added (120 chosen at the edge)
  max_fit_rows: 300000

patient_ar:                       # causal per-patient AR, ridge-shrunk to the pooled fit
  ridge_lambda: 50.0
  min_pairs: 288                  # about 1 day at 5 min; below this the pooled fit is used

lightgbm:
  target: delta                   # predict y(t+h) - glucose(t)
  num_leaves_grid: [15, 63]
  params:
    learning_rate: 0.05
    n_estimators: 2000
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 8
    verbose: -1
  early_stopping_rounds: 50
  classifier_num_leaves_grid: [31]   # single value: keeps 18 classifiers/fold affordable
  classifier_events: [hyper180_any, hyper180_at, hyper140_any, hyper140_at, hypo70_any, hypo70_at]

events:
  definitions: [any, at]
  min_pos_windows: 30             # reliability rule (owner): >= 30 positive windows AND
  min_pos_patients: 5             # >= 5 patients with events, else "not reliable"
  never_report:                   # owner policy: never claim hypo accuracy on CGMacros
    cgmacros: [hypo70]

bootstrap:
  n_boot: 1000
  auc_bins: 2000
  ci: 0.95

window_selection:                 # N chosen by patient-grouped CV on HOLDOUT-TRAIN patients only
  n_splits: 5
  model: lgbm_cgm_tod
  horizons_min: [30, 60, 120]

shuffle_check:                    # labels shuffled across ALL training rows -> chance expected
  cohort: cgmacros
  event: hyper180_any_60
  horizon_min: 60
  n_shuffles: 5

sensitivity_exclude:              # evaluation-only exclusion (training unchanged)
  cgmacros: [cgmacros_007]

groups:                           # reporting groups
  hba1c_bins_pct: [0, 7.0, 9.0, 100]
  hba1c_labels: ["<7", "7-9", ">=9"]
