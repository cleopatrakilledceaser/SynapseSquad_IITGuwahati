# Part 4: mechanistic ODE twin (gut + Bergman minimal model + insulin surrogate + activity).
# Units: glucose mg/dL, time min, carbohydrate g. Decisions: docs/DECISIONS.md D-031 onwards.
seed: 42
horizons_min: [30, 60, 120]
adapt_days: [0, 1, 3]              # k: days of the patient's own data used for PARAMETERS
test_from_day: 3                   # identical test windows for every k: anchors with day >= 3
cv_repeat: 0                       # patient folds = Part 2/3 CV repeat 0 (same as LightGBM)

solver:
  dt_min: 5.0                      # grid step (CGMacros native)
  n_sub: 1                         # RK4 sub-steps per grid step (Shanghai 15-min grid: 3)
  g_bounds: [20.0, 600.0]          # state clipping (mg/dL), physical range
  x_bounds: [-0.05, 0.2]           # insulin action (1/min)

# Parameters. "fit" ones are estimated on log scale within [lo, hi]; the prior (weak, stage 1)
# is N(log(mean), sd) on log scale. "fixed" ones are not identifiable from CGM alone (D-031).
params:
  fit:
    Gb:    {mean: 115.0, sd: 0.3, lo: 60.0, hi: 250.0}     # basal glucose (mg/dL)
    SG:    {mean: 0.01, sd: 1.0, lo: 0.001, hi: 0.1}       # glucose effectiveness (1/min)
    SI:    {mean: 0.0002, sd: 1.5, lo: 0.000001, hi: 0.01} # insulin-surrogate sensitivity
    fc:    {mean: 4.0, sd: 1.0, lo: 0.3, hi: 30.0}         # glucose gain per g carb (mg/dL/g)
    kabs:  {mean: 0.03, sd: 0.7, lo: 0.005, hi: 0.2}       # gut transit rate (1/min)
    beta:  {mean: 0.5, sd: 1.0, lo: 0.01, hi: 10.0}        # fat/protein/fiber slowing
  fixed:
    p2: 0.02                       # insulin-action rate (1/min), Bergman minimal-model range
    tauI: 20.0                     # insulin-surrogate time constant (min)
    cR: 20.0                       # feed-forward of gut appearance into the surrogate (min)
    tauE: 30.0                     # activity-effect time constant (min)
    soft_s: 10.0                   # softplus smoothness of (G - Gb)+ (mg/dL)
  slow_protein_weight: 0.5         # slowing ratio = (fat + w*protein + fiber) / (carbs + 1)

activity:
  # alpha_E is POPULATION level: chosen on training patients only (nested), never per patient.
  # widened after the timing fold picked the lower edge (0.0005); see D-032
  alpha_grid: [0.0001, 0.00025, 0.0005, 0.001, 0.002, 0.004, 0.008]   # 1/min per unit of E
  hr_scale_bpm: 20.0               # HR above rest is divided by this
  rest_quantile: 0.25              # resting level = past-only expanding quantile per patient
  min_rest_samples: 72             # 6 h of samples before the patient's own rest level is used
  hr_rest_default_bpm: 70.0        # until then: this default (rule defined in D-033)
  intensity_rest_default: 0.0

fit:
  sigma_obs: 15.0                  # likelihood sd (sensor + model error, mg/dL)
  segment_hours: 6                 # G is reset to the observed reading every segment (D-031)
  max_nfev: 300
  stage1_days: 3                   # population prior from training patients' first 3 days
  prior_sd_floor: 0.15             # floor on population / ridge-residual sd (log scale)

prior:
  static_features: [bmi, hba1c_pct, fasting_glucose_mgdl, fasting_insulin, age_years, sex_male]
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]   # chosen by LOO over training patients

ekf:
  # Q = q_scale * diag(base); R = r (mg/dL)^2. (q_scale, r) chosen per k on training patients
  # only, by mean Gaussian NLL of the 30/60/120-min forecasts (D-032).
  q_base: {Q1: 1.0, Q2: 1.0, G: 4.0, U: 4.0, X: 0.0000001, E: 0.0}
  # widened after the timing fold picked the corner (4, 64); see D-032
  q_scale_grid: [1.0, 4.0, 16.0, 64.0]
  r_grid: [25.0, 64.0, 144.0, 256.0]
  p0: {Q1: 100.0, Q2: 100.0, G: 100.0, U: 100.0, X: 0.000001, E: 0.01}
  train_eval_stride: 4             # every 4th training-patient anchor (1/h) for selection
  default: {q_scale: 1.0, r: 25.0} # used only while choosing alpha_E (training patients)

patient_ar:                        # per-patient AR refit on EXACTLY the first k days (k = 1, 3)
  ridge_lambda: 50.0               # as Part 2 (D-024)
  min_pairs: 50                    # below this the pooled AR is used

lgbm:                              # population LightGBM: CGM + time of day + meals, delta target
  groups: [cgm, tod, meals]

intervals: [0.8, 0.95]             # predictive-interval coverage levels

identifiability:
  n_synthetic: 200
  noise_sd: 8.0                    # synthetic CGM noise for recovery (mg/dL)
  contraction_min: 0.5             # 1 - post_var/prior_var below this = not identifiable
  retest_min: 0.5                  # corr of log estimates, days 0-3 vs days 3-6 (D-034)
  at_bound_tol_log: 0.01           # a fit is "at a bound" within 1% (log scale) of it
  at_bound_flag: 0.2               # flag a parameter if more than 20% of fits sit at a bound
  profile_patients: 5
  profile_points: 9
  profile_halfwidth_log: 1.0

shanghai:                          # meal timing only (no macros): pooled dose x per-patient fc
  enabled: true
  k: 3
  pooled_dose_g: 50.0              # nominal carbohydrate per logged meal; only fc*dose is
  free: [Gb, SG, SI, fc, kabs]     # identifiable, so the dose is fixed and fc absorbs the scale
  n_sub: 3

revision:                          # Part 4b (D-037), chosen on training patients / days < 3 only
  tag: _rev                        # output suffix; the original outputs are kept unchanged
  sg_lo: 1.0e-5                    # SG lower bound widened from 0.001 (binding, see diagnosis)
  fix: [beta]                      # beta = training-population mean (not identifiable per patient)

simulate:
  n_patients: 100
  days: 7
  noise_ar1: null                  # null: estimated from fit residuals
  phenotype: default               # "indian": documented placeholder, not implemented (Part 11)

whatif:                            # SIMULATED illustration only
  meals_g: [30, 60]
  walk: {start_after_meal_min: 15, duration_min: 30, intensity: 2.0}
  hours: 5
