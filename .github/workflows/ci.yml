name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: make lint PY=python
      - name: Test
        run: make test PY=python
      - name: Smoke (synthetic toy fixture)
        run: make smoke PY=python
