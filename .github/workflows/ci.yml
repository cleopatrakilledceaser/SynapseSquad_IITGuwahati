name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: make lint PY=python
      - name: Test
        run: |
          set +e
          python -m pytest --tb=line -q > pytest_out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=pytest exit $code::$(grep -E 'Error|FAILED|ERROR|assert' pytest_out.txt | head -12 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          cat pytest_out.txt | tail -30
          exit $code
      - name: Smoke (synthetic toy fixture)
        run: make smoke PY=python
