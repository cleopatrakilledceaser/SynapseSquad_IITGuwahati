[project]
name = "glucotwin"
version = "0.1.0"
description = "GlucoTwin: patient-specific glucose digital twin for T2D/prediabetes (research prototype, not a medical device)."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "SIM", "NPY", "PD"]
ignore = ["PD901"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Part 9 dashboard: long CSS / HTML / table-row lines are kept on one line on purpose.
"src/dash/*" = ["E501", "N812", "N818"]
"src/appdata/build.py" = ["E501"]
"src/india/*.py" = ["E501"]
"src/federated/*.py" = ["E501"]
"tests/test_federated.py" = ["E501"]
"tests/test_india_stress.py" = ["E501"]
"tests/test_india_sleep.py" = ["E501"]
"tests/test_transfer.py" = ["E501"]
"src/transfer/*.py" = ["E501"]
"src/appdata/rt.py" = ["E501", "N803", "N806"]
"src/appdata/whatif_grid.py" = ["E501"]
"tests/test_dash.py" = ["E501", "N812"]
"tests/test_appdata_rt.py" = ["N803", "N806"]
# fit/predict implement a documented common protocol (module docstring); per-method docstrings
# would only repeat it.
"src/models/baselines.py" = ["D102"]
"src/models/lgbm.py" = ["D102"]
"**/__init__.py" = ["D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
